[project]
name = "web-lead-agent"
version = "0.1.0"
description = "Lead website verification MVP with deterministic scoring and human-review safeguards"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
